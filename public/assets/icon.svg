<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a22"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#8db4ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8db4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- a grid of share-preview cards; the top-left one lit -->
  <g fill="none" stroke="#8db4ff" stroke-width="16" stroke-linejoin="round">
    <rect x="128" y="128" width="110" height="110" rx="20" fill="#8db4ff" fill-opacity="0.9" stroke="none"/>
    <rect x="274" y="128" width="110" height="110" rx="20" stroke-opacity="0.85"/>
    <rect x="128" y="274" width="110" height="110" rx="20" stroke-opacity="0.85"/>
    <rect x="274" y="274" width="110" height="110" rx="20" stroke="#c39bff" stroke-opacity="0.85"/>
  </g>
</svg>
